<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merry Mery English - Exercises & Quizzes</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Librería para voz británica garantizada en celulares -->
    <script src="https://code.responsivevoice.org/responsivevoice.js?key=FREE_KEY"></script>

    <style>
        :root {
            --primary: #0d9488;
            --primary-hover: #0f766e;
            --bg-color: #f0fdfa;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --accent-blue: #e0f2fe;
            --btn-blue: #0284c7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px 15px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 680px;
            width: 100%;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px 25px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-logo-wrapper {
            width: 140px;
            height: 140px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header img.logo {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 50%;
        }

        .header h1 {
            color: var(--primary);
            font-size: 1.8rem;
            font-weight: 700;
        }

        /* Cambridge Search Box */
        .dictionary-card {
            background: var(--accent-blue);
            border: 1px solid #bae6fd;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            margin-bottom: 30px;
        }

        .dictionary-card h3 {
            color: #0369a1;
            font-size: 1.05rem;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .search-box {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        .search-box input {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }

        .search-box button {
            background: var(--btn-blue);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .search-box button:hover {
            background: #0369a1;
        }

        .dictionary-link {
            display: inline-block;
            color: #0284c7;
            text-decoration: none;
            font-size: 0.88rem;
            font-weight: 600;
        }

        /* Section Styling */
        .section-title {
            font-size: 1.1rem;
            color: var(--primary);
            margin: 25px 0 12px 0;
            padding-bottom: 5px;
            border-bottom: 2px solid #ccfbf1;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-item {
            display: block;
            background-color: var(--primary);
            color: white;
            text-decoration: none;
            padding: 14px 20px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.98rem;
            transition: transform 0.2s, background-color 0.2s;
            box-shadow: 0 3px 6px rgba(13, 148, 136, 0.15);
        }

        .btn-item:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
        }

        /* Instagram Footer */
        .footer {
            margin-top: 35px;
            text-align: center;
        }

        .insta-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 25px;
            background: #fff;
            color: #d62976;
            border: 1px solid #fbcfe8;
            font-weight: 600;
            font-size: 0.9rem;
            text-decoration: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: background 0.2s;
        }

        .insta-btn:hover {
            background: #fdf2f8;
        }
    </style>
</head>
<body>
