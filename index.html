<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Merry Mery English | Interactive Exercises</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --teal: #0d9488;
      --teal-dark: #0f766e;
      --teal-light: #f0fdfa;
      --teal-border: #99f6e4;
      --slate-900: #0f172a;
      --slate-700: #334155;
      --slate-500: #64748b;
      --slate-200: #e2e8f0;
      --bg: #f8fafc;
      --card: #ffffff;
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 10px 25px -5px rgba(15, 23, 42, 0.07);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg);
      color: var(--slate-900);
      line-height: 1.5;
      min-height: 100vh;
    }

    h1, h2, h3, .brand-font {
      font-family: 'Outfit', sans-serif;
    }

    /* ================= HEADER ================= */
    .topbar {
      background: var(--card);
      border-bottom: 1px solid var(--slate-200);
      padding: 16px 24px;
      position: sticky;
      top: 0;
      z-index: 30;
    }

    .topbar-inner {
      max-width: 1020px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
      color: var(--slate-900);
    }

    .brand-logo {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--teal);
      background: #ffffff;
    }

    .brand-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--slate-900);
    }

    .brand-title span {
      color: var(--teal);
    }

    .brand-subtitle {
      font-size: 0.82rem;
      color: var(--slate-500);
      font-weight: 500;
    }

    .btn-progress-top {
      background: var(--teal-light);
      color: var(--teal-dark);
      border: 1px solid var(--teal-border);
      padding: 9px 16px;
      border-radius: 10px;
      font-family: 'Outfit', sans-serif;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s ease;
    }

    .btn-progress-top:hover {
      background: var(--teal);
      color: #ffffff;
      border-color: var(--teal);
    }

    /* ================= MAIN CONTAINER ================= */
    .container {
      max-width: 1020px;
      margin: 0 auto;
      padding: 32px 24px 96px;
    }

    .intro-banner {
      background: linear-gradient(135deg, #0f766e 0%, #0d9488 100%);
      color: #ffffff;
      border-radius: 20px;
      padding: 28px 32px;
      margin-bottom: 28px;
      box-shadow: var(--shadow-md);
    }

    .intro-banner h1 {
      font-size: 1.75rem;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .intro-banner p {
      font-size: 0.96rem;
      color: rgba(255, 255, 255, 0.9);
    }

    /* ================= CATEGORY BUTTONS (NO ICONS/EMOJIS) ================= */
    .category-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 28px;
    }

    .category-btn {
      padding: 10px 18px;
      border-radius: 999px;
      border: 1px solid var(--slate-200);
      background: #ffffff;
      font-family: 'Outfit', sans-serif;
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--slate-700);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .category-btn:hover {
      border-color: var(--teal);
      color: var(--teal-dark);
    }

    .category-btn.active {
      background: var(--teal);
      color: #ffffff;
      border-color: var(--teal);
      box-shadow: 0 4px 12px rgba(13, 148, 136, 0.22);
    }

    /* ================= CATEGORY SECTIONS & VERTICAL LISTS ================= */
    .category-section {
      background: #ffffff;
      border: 1px solid var(--slate-200);
      border-radius: 18px;
      margin-bottom: 24px;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    .category-section-header {
      padding: 18px 24px;
      background: var(--teal-light);
      border-bottom: 1px solid var(--teal-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .category-section-header h2 {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--teal-dark);
    }

    .category-count {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--teal-dark);
      background: #ffffff;
      padding: 3px 10px;
      border-radius: 999px;
      border: 1px solid var(--teal-border);
    }

    .exercise-list {
      list-style: none;
    }

    .exercise-item {
      border-bottom: 1px solid var(--slate-200);
    }

    .exercise-item:last-child {
      border-bottom: none;
    }

    .exercise-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 24px;
      text-decoration: none;
      color: var(--slate-900);
      transition: background-color 0.15s ease;
    }

    .exercise-link:hover {
      background-color: #f8fafc;
    }

    .exercise-link:hover .exercise-title {
      color: var(--teal-dark);
    }

    .exercise-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .exercise-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--slate-900);
      transition: color 0.15s ease;
    }

    .exercise-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .skill-pill {
      font-size: 0.74rem;
      font-weight: 600;
      color: var(--slate-500);
      background: #f1f5f9;
      padding: 2px 9px;
      border-radius: 6px;
    }

    .exercise-action {
      font-family: 'Outfit', sans-serif;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--teal-dark);
      white-space: nowrap;
      padding: 6px 14px;
      border-radius: 8px;
      background: var(--teal-light);
      border: 1px solid var(--teal-border);
    }

    .exercise-link:hover .exercise-action {
      background: var(--teal);
      color: #ffffff;
      border-color: var(--teal);
    }

    /* ================= PROGRESS PANEL ================= */
    #progress-panel {
      margin-top: 36px;
      background: #ffffff;
      border: 1px solid var(--slate-200);
      border-radius: 18px;
      padding: 26px;
      box-shadow: var(--shadow-sm);
    }

    .progress-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--slate-200);
    }

    .progress-header h2 {
      font-size: 1.25rem;
      color: var(--slate-900);
    }

    .progress-summary {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--teal-dark);
      background: var(--teal-light);
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid var(--teal-border);
    }

    .skills-list-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    @media (max-width: 820px) {
      .skills-list-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 540px) {
      .skills-list-grid {
        grid-template-columns: 1fr;
      }
      .exercise-link {
        flex-direction: column;
        align-items: flex-start;
      }
    }

    .skill-row-card {
      border: 1px solid var(--slate-200);
      border-radius: 12px;
      padding: 14px 16px;
      background: #f8fafc;
    }

    .skill-row-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
    }

    .skill-row-top span:last-child {
      color: var(--teal-dark);
    }

    .bar-bg {
      height: 7px;
      background: var(--slate-200);
      border-radius: 999px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background: var(--teal);
      border-radius: 999px;
      width: 0%;
    }

    .floating-progress {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 40;
      background: var(--teal-dark);
      color: #ffffff;
      text-decoration: none;
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 0.92rem;
      padding: 12px 20px;
      border-radius: 999px;
      box-shadow: 0 10px 22px rgba(15, 118, 110, 0.32);
    }

    .floating-progress:hover {
      background: var(--teal);
    }
  </style>
</head>
<body>

  <header class="topbar" id="top">
    <div class="topbar-inner">
      <a href="index.html" class="brand">
        <img src="logo.png" alt="Merry Mery English" class="brand-logo" />
        <div>
          <div class="brand-title">Merry Mery <span>English</span></div>
          <div class="brand-subtitle">Interactive Practice Portal</div>
        </div>
      </a>

      <a href="#progress-panel" class="btn-progress-top">My Progress</a>
    </div>
  </header>

  <main class="container">
    <section class="intro-banner">
      <h1>Interactive Exercises</h1>
      <p>Select a category or click directly on any activity below to start practicing.</p>
    </section>

    <nav class="category-bar" aria-label="Exercise Categories" id="category-bar">
      <button type="button" class="category-btn active" data-category="all">All Exercises</button>
      <button type="button" class="category-btn" data-category="grammar">Grammar</button>
      <button type="button" class="category-btn" data-category="vocabulary">Vocabulary</button>
      <button type="button" class="category-btn" data-category="reading">Reading</button>
      <button type="button" class="category-btn" data-category="listening">Listening &amp; Songs</button>
      <button type="button" class="category-btn" data-category="writing">Writing</button>
    </nav>

    <div id="catalog-container"></div>

    <section id="progress-panel">
      <div class="progress-header">
        <h2>My Progress</h2>
        <div class="progress-summary" id="progress-summary">Completed: 0 / 15</div>
      </div>
      <div class="skills-list-grid" id="skills-grid"></div>
    </section>
  </main>

  <a href="#progress-panel" class="floating-progress">My Progress</a>

  <script>
    (function () {
      const STORAGE_KEY = "mme_portal_scores_v1";

      const CATEGORIES = [
        {
          id: "grammar",
          name: "Grammar",
          exercises: [
            { id: "simple-present-do-does", title: "Simple Present: Do & Does", url: "simple_present_do-does.html", tags: ["Grammar", "Listening"] },
            { id: "demonstratives", title: "Demonstratives (This, That, These, Those)", url: "demonstratives.html", tags: ["Grammar", "Vocabulary"] },
            { id: "possessive-adjectives-pronouns", title: "Possessive Adjectives & Subject Pronouns", url: "possessive_adjectives_subject_pronouns.html", tags: ["Grammar", "Listening"] },
            { id: "conditionals", title: "Conditionals 0, 1 & 2 in Context", url: "conditionals.html", tags: ["Grammar"] },
            { id: "gerund-inf", title: "Gerunds vs. Infinitives & -ing Forms", url: "gerunds-ing.html", tags: ["Grammar", "Gerunds & -ing"] }
          ]
        },
        {
          id: "vocabulary",
          name: "Vocabulary",
          exercises: [
            { id: "collocations-biz", title: "Make, Do, Take & Have Collocations", url: "collocations.html", tags: ["Vocabulary", "Collocations"] },
            { id: "phrasal-work", title: "Phrasal Verbs for Work & Meetings", url: "phrasal-verbs.html", tags: ["Vocabulary", "Phrasal Verbs"] },
            { id: "idioms-daily", title: "Everyday English Idioms", url: "idioms.html", tags: ["Vocabulary", "Idioms"] }
          ]
        },
        {
          id: "reading",
          name: "Reading",
          exercises: [
            { id: "learning-english-tips", title: "Learning English Tips", url: "learning_english_tips.html", tags: ["Reading", "Vocabulary", "Listening"] },
            { id: "airport-notice", title: "Airport Notice Reading", url: "airport_notice_reading.html", tags: ["Reading", "Vocabulary"] },
            { id: "little-prince", title: "The Little Prince - Chapter I", url: "little-prince.html", tags: ["Reading", "Vocabulary"] }
          ]
        },
        {
          id: "listening",
          name: "Listening & Songs",
          exercises: [
            { id: "animals-maroon", title: "Animals - Maroon 5", url: "animals_maroon.html", tags: ["Listening", "Vocabulary"] },
            { id: "somebody-used-to-know", title: "Somebody That I Used to Know", url: "CancionSomebodyusedtoknow.html", tags: ["Listening", "Vocabulary"] },
            { id: "i-gonna-be", title: "I'm Gonna Be (500 Miles)", url: "I_gonna_be.html", tags: ["Listening", "Vocabulary"] },
            { id: "song-lumineers", title: "Ho Hey - The Lumineers", url: "ho-hey.html", tags: ["Listening", "Vocabulary"] }
          ]
        },
        {
          id: "writing",
          name: "Writing",
          exercises: [
            { id: "balanced-essay", title: "Balanced Essay Practice", url: "Balanced_Essay.html", tags: ["Writing"] },
            { id: "writing-email", title: "Writing 1: Professional Follow-up Email", url: "writing-1.html", tags: ["Writing"] },
            { id: "writing-story", title: "Writing 2: A Memorable Trip (Past Tenses)", url: "writing-2.html", tags: ["Writing"] }
          ]
        }
      ];

      const SKILLS = [
        { id: "grammar", label: "Grammar" },
        { id: "gerunds", label: "Gerunds & -ing Forms" },
        { id: "vocabulary", label: "Vocabulary" },
        { id: "collocations", label: "Collocations" },
        { id: "phrasal", label: "Phrasal Verbs" },
        { id: "idioms", label: "Idioms" },
        { id: "listening", label: "Listening" },
        { id: "reading", label: "Reading Comprehension" },
        { id: "writing", label: "Writing" }
      ];

      let activeCategory = "all";

      function loadScores() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          return raw ? JSON.parse(raw) : {};
        } catch (e) {
          return {};
        }
      }

      const scores = loadScores();

      function renderCatalog() {
        const container = document.getElementById("catalog-container");
        if (!container) return;

        const visibleCategories = CATEGORIES.filter(
          (cat) => activeCategory === "all" || cat.id === activeCategory
        );

        container.innerHTML = visibleCategories.map((cat) => {
          const itemsHtml = cat.exercises.map((ex) => {
            const tagsHtml = ex.tags.map((t) => `<span class="skill-pill">${t}</span>`).join("");
            const rec = scores[ex.id];
            let actionText = "Open Exercise";

            if (rec) {
              const vals = Object.values(rec).filter((v) => typeof v === "number");
              if (vals.length) {
                const avg = Math.round(vals.reduce((a, b) => a + b, 0) / vals.length);
                actionText = `Completed (${avg}%)`;
              }
            }

            return `
              <li class="exercise-item">
                <a href="${ex.url}" class="exercise-link">
                  <div class="exercise-info">
                    <span class="exercise-title">${ex.title}</span>
                    <div class="exercise-meta">${tagsHtml}</div>
                  </div>
                  <span class="exercise-action">${actionText}</span>
                </a>
              </li>
            `;
          }).join("");

          return `
            <section class="category-section">
              <div class="category-section-header">
                <h2>${cat.name}</h2>
                <span class="category-count">${cat.exercises.length} ${cat.exercises.length === 1 ? "exercise" : "exercises"}</span>
              </div>
              <ul class="exercise-list">
                ${itemsHtml}
              </ul>
            </section>
          `;
        }).join("");
      }

      function renderProgress() {
        const allExercises = CATEGORIES.flatMap((c) => c.exercises);
        let completed = 0;
        const buckets = {};
        SKILLS.forEach((s) => { buckets[s.id] = []; });

        Object.entries(scores).forEach(([exId, data]) => {
          if (!data) return;
          completed++;
          SKILLS.forEach((s) => {
            if (typeof data[s.id] === "number") {
              buckets[s.id].push(data[s.id]);
            }
          });
        });

        const summaryEl = document.getElementById("progress-summary");
        if (summaryEl) {
          summaryEl.textContent = `Completed: ${completed} / ${allExercises.length}`;
        }

        const gridEl = document.getElementById("skills-grid");
        if (!gridEl) return;

        gridEl.innerHTML = SKILLS.map((s) => {
          const arr = buckets[s.id];
          const avg = arr.length ? Math.round(arr.reduce((a, b) => a + b, 0) / arr.length) : 0;
          const labelRight = arr.length ? `${avg}%` : "No data";
          return `
            <div class="skill-row-card">
              <div class="skill-row-top">
                <span>${s.label}</span>
                <span>${labelRight}</span>
              </div>
              <div class="bar-bg">
                <div class="bar-fill" style="width:${avg}%"></div>
              </div>
            </div>
          `;
        }).join("");
      }

      function init() {
        renderCatalog();
        renderProgress();

        document.querySelectorAll(".category-btn").forEach((btn) => {
          btn.addEventListener("click", () => {
            activeCategory = btn.getAttribute("data-category") || "all";
            document.querySelectorAll(".category-btn").forEach((b) => b.classList.remove("active"));
            btn.classList.add("active");
            renderCatalog();
          });
        });
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", init);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
