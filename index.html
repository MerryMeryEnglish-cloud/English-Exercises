<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Merry Mery English | Interactive Exercises</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --teal-900: #134e4a;
      --teal-700: #0f766e;
      --teal-600: #0d9488;
      --teal-500: #14b8a6;
      --teal-100: #ccfbf1;
      --teal-50: #f0fdfa;
      --coral-500: #f43f5e;
      --coral-100: #ffe4e6;
      --amber-500: #f59e0b;
      --amber-100: #fef3c7;
      --indigo-600: #4f46e5;
      --indigo-100: #e0e7ff;
      --sky-600: #0284c7;
      --sky-100: #e0f2fe;
      --slate-900: #0f172a;
      --slate-700: #334155;
      --slate-500: #64748b;
      --slate-200: #e2e8f0;
      --bg: #f4f7f9;
      --card: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg);
      background-image:
        radial-gradient(at 0% 0%, rgba(20, 184, 166, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(244, 63, 94, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(245, 158, 11, 0.08) 0px, transparent 50%);
      color: var(--slate-900);
      line-height: 1.5;
      min-height: 100vh;
    }

    h1, h2, h3, .brand-font {
      font-family: 'Outfit', sans-serif;
    }

    /* ================= HEADER ================= */
    .topbar {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(15, 23, 42, 0.07);
      padding: 14px 24px;
      position: sticky;
      top: 0;
      z-index: 30;
    }

    .topbar-inner {
      max-width: 1080px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
      color: var(--slate-900);
    }

    .brand-logo-ring {
      padding: 3px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--teal-500), var(--coral-500), var(--amber-500));
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(13, 148, 136, 0.25);
    }

    .brand-logo {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      object-fit: cover;
      background: #ffffff;
      display: block;
    }

    .brand-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--slate-900);
      line-height: 1.15;
    }

    .brand-title span {
      background: linear-gradient(135deg, var(--teal-700), var(--teal-500));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-subtitle {
      font-size: 0.8rem;
      color: var(--slate-500);
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .btn-progress-top {
      background: linear-gradient(135deg, var(--teal-700), var(--teal-600));
      color: #ffffff;
      border: none;
      padding: 10px 20px;
      border-radius: 999px;
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 4px 12px rgba(13, 148, 136, 0.25);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .btn-progress-top:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(13, 148, 136, 0.35);
    }

    /* ================= MAIN CONTAINER ================= */
    .container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 30px 24px 104px;
    }

    /* ================= HERO BANNER ================= */
    .hero-card {
      background: linear-gradient(125deg, #134e4a 0%, #0f766e 48%, #0d9488 100%);
      color: #ffffff;
      border-radius: 24px;
      padding: 34px 36px;
      margin-bottom: 28px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 18px 36px -12px rgba(15, 118, 110, 0.38);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      flex-wrap: wrap;
    }

    .hero-card::before {
      content: "";
      position: absolute;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(244, 63, 94, 0.28) 0%, transparent 70%);
      top: -90px;
      right: -40px;
      pointer-events: none;
    }

    .hero-card::after {
      content: "";
      position: absolute;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.25) 0%, transparent 70%);
      bottom: -80px;
      left: 35%;
      pointer-events: none;
    }

    .hero-content {
      position: relative;
      z-index: 1;
      max-width: 620px;
    }

    .hero-kicker {
      display: inline-block;
      background: rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(6px);
      padding: 5px 14px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 12px;
      border: 1px solid rgba(255, 255, 255, 0.22);
    }

    .hero-card h1 {
      font-size: 2rem;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 8px;
    }

    .hero-card p {
      font-size: 0.98rem;
      color: rgba(255, 255, 255, 0.9);
    }

    .hero-stats {
      position: relative;
      z-index: 1;
      display: flex;
      gap: 14px;
    }

    .hero-stat-box {
      background: rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 16px;
      padding: 14px 20px;
      text-align: center;
      min-width: 112px;
    }

    .hero-stat-box strong {
      display: block;
      font-family: 'Outfit', sans-serif;
      font-size: 1.65rem;
      font-weight: 800;
      line-height: 1.1;
    }

    .hero-stat-box span {
      font-size: 0.76rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      opacity: 0.88;
    }

    /* ================= CATEGORY BUTTONS (NO ICONS/EMOJIS) ================= */
    .category-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 28px;
    }

    .category-btn {
      padding: 11px 20px;
      border-radius: 999px;
      border: 1.5px solid var(--slate-200);
      background: #ffffff;
      font-family: 'Outfit', sans-serif;
      font-size: 0.94rem;
      font-weight: 700;
      color: var(--slate-700);
      cursor: pointer;
      transition: all 0.18s ease;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.04);
    }

    .category-btn:hover {
      border-color: var(--teal-500);
      color: var(--teal-700);
      transform: translateY(-1px);
    }

    .category-btn.active {
      background: linear-gradient(135deg, var(--teal-700), var(--teal-500));
      color: #ffffff;
      border-color: transparent;
      box-shadow: 0 8px 18px -4px rgba(13, 148, 136, 0.38);
    }

    /* ================= CATEGORY SECTIONS & VERTICAL LISTS ================= */
    .category-section {
      background: #ffffff;
      border: 1px solid rgba(15, 23, 42, 0.07);
      border-radius: 20px;
      margin-bottom: 26px;
      overflow: hidden;
      box-shadow: 0 8px 24px -6px rgba(15, 23, 42, 0.06);
    }

    .category-section-header {
      padding: 18px 26px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(15, 23, 42, 0.06);
      border-left: 6px solid var(--cat-accent, var(--teal-600));
      background: var(--cat-bg, var(--teal-50));
    }

    .category-section-header h2 {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--slate-900);
    }

    .category-count {
      font-family: 'Outfit', sans-serif;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--cat-accent, var(--teal-700));
      background: #ffffff;
      padding: 4px 12px;
      border-radius: 999px;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.05);
    }

    .exercise-list {
      list-style: none;
    }

    .exercise-item {
      border-bottom: 1px solid #f1f5f9;
    }

    .exercise-item:last-child {
      border-bottom: none;
    }

    .exercise-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 26px;
      text-decoration: none;
      color: var(--slate-900);
      transition: all 0.16s ease;
      position: relative;
    }

    .exercise-link:hover {
      background: linear-gradient(90deg, rgba(240, 253, 250, 0.85) 0%, #ffffff 100%);
      padding-left: 32px;
    }

    .exercise-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .exercise-index {
      width: 34px;
      height: 34px;
      min-width: 34px;
      border-radius: 10px;
      background: var(--cat-bg, var(--teal-50));
      color: var(--cat-accent, var(--teal-700));
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.16s ease;
    }

    .exercise-link:hover .exercise-index {
      background: var(--cat-accent, var(--teal-600));
      color: #ffffff;
    }

    .exercise-info {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .exercise-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.08rem;
      font-weight: 700;
      color: var(--slate-900);
      transition: color 0.15s ease;
    }

    .exercise-link:hover .exercise-title {
      color: var(--teal-700);
    }

    .exercise-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .skill-pill {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--slate-600);
      background: #f1f5f9;
      padding: 3px 10px;
      border-radius: 999px;
    }

    .exercise-action {
      font-family: 'Outfit', sans-serif;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--teal-700);
      white-space: nowrap;
      padding: 8px 16px;
      border-radius: 999px;
      background: var(--teal-50);
      border: 1px solid var(--teal-100);
      transition: all 0.16s ease;
    }

    .exercise-action.done {
      background: #dcfce7;
      color: #166534;
      border-color: #bbf7d0;
    }

    .exercise-link:hover .exercise-action {
      background: var(--teal-600);
      color: #ffffff;
      border-color: var(--teal-600);
      box-shadow: 0 4px 12px rgba(13, 148, 136, 0.25);
    }

    /* ================= PROGRESS PANEL ================= */
    #progress-panel {
      margin-top: 38px;
      background: #ffffff;
      border: 1px solid rgba(15, 23, 42, 0.07);
      border-radius: 22px;
      padding: 28px;
      box-shadow: 0 8px 24px -6px rgba(15, 23, 42, 0.06);
    }

    .progress-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--slate-200);
    }

    .progress-header h2 {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--slate-900);
    }

    .progress-summary {
      font-family: 'Outfit', sans-serif;
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--teal-700);
      background: var(--teal-50);
      padding: 6px 16px;
      border-radius: 999px;
      border: 1px solid var(--teal-100);
    }

    .skills-list-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    @media (max-width: 820px) {
      .skills-list-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 580px) {
      .skills-list-grid {
        grid-template-columns: 1fr;
      }
      .exercise-link {
        flex-direction: column;
        align-items: flex-start;
      }
      .exercise-action {
        align-self: flex-start;
      }
    }

    .skill-row-card {
      border: 1px solid var(--slate-200);
      border-radius: 14px;
      padding: 16px;
      background: #f8fafc;
    }

    .skill-row-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
    }

    .skill-row-top span:last-child {
      color: var(--teal-700);
    }

    .bar-bg {
      height: 8px;
      background: var(--slate-200);
      border-radius: 999px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--teal-600), var(--teal-500));
      border-radius: 999px;
      width: 0%;
      transition: width 0.4s ease;
    }

    .floating-progress {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 40;
      background: linear-gradient(135deg, var(--teal-700), var(--coral-500));
      color: #ffffff;
      text-decoration: none;
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 0.94rem;
      padding: 13px 22px;
      border-radius: 999px;
      box-shadow: 0 10px 24px rgba(15, 118, 110, 0.35);
      transition: transform 0.15s ease;
    }

    .floating-progress:hover {
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <header class="topbar" id="top">
    <div class="topbar-inner">
      <a href="index.html" class="brand">
        <span class="brand-logo-ring">
          <img src="logo.png" alt="Merry Mery English" class="brand-logo" />
        </span>
        <div>
          <div class="brand-title">Merry Mery <span>English</span></div>
          <div class="brand-subtitle">Interactive Practice Portal</div>
        </div>
      </a>

      <a href="#progress-panel" class="btn-progress-top">My Progress</a>
    </div>
  </header>

  <main class="container">
    <section class="hero-card">
      <div class="hero-content">
        <span class="hero-kicker">Self-Paced English Practice</span>
        <h1>Explore Interactive Exercises</h1>
        <p>Filter by skill area or click directly on any lesson below to launch the interactive module.</p>
      </div>
      <div class="hero-stats">
        <div class="hero-stat-box">
          <strong id="total-ex-stat">18</strong>
          <span>Modules</span>
        </div>
        <div class="hero-stat-box">
          <strong id="completed-ex-stat">0</strong>
          <span>Completed</span>
        </div>
      </div>
    </section>

    <nav class="category-bar" aria-label="Exercise Categories" id="category-bar">
      <button type="button" class="category-btn active" data-category="all">All Exercises</button>
      <button type="button" class="category-btn" data-category="grammar">Grammar</button>
      <button type="button" class="category-btn" data-category="vocabulary">Vocabulary</button>
      <button type="button" class="category-btn" data-category="reading">Reading</button>
      <button type="button" class="category-btn" data-category="listening">Listening &amp; Songs</button>
      <button type="button" class="category-btn" data-category="writing">Writing</button>
    </nav>

    <div id="catalog-container"></div>

    <section id="progress-panel">
      <div class="progress-header">
        <h2>My Progress</h2>
        <div class="progress-summary" id="progress-summary">Completed: 0 / 18</div>
      </div>
      <div class="skills-list-grid" id="skills-grid"></div>
    </section>
  </main>

  <a href="#progress-panel" class="floating-progress">My Progress</a>

  <script>
    (function () {
      const STORAGE_KEY = "mme_portal_scores_v1";

      const CATEGORIES = [
        {
          id: "grammar",
          name: "Grammar",
          accent: "#0d9488",
          bg: "#f0fdfa",
          exercises: [
            { id: "simple-present-do-does", title: "Simple Present: Do & Does", url: "simple_present_do-does.html", tags: ["Grammar", "Listening"] },
            { id: "demonstratives", title: "Demonstratives (This, That, These, Those)", url: "demonstratives.html", tags: ["Grammar", "Vocabulary"] },
            { id: "possessive-adjectives-pronouns", title: "Possessive Adjectives & Subject Pronouns", url: "possessive_adjectives_subject_pronouns.html", tags: ["Grammar", "Listening"] },
            { id: "conditionals", title: "Conditionals 0, 1 & 2 in Context", url: "conditionals.html", tags: ["Grammar"] },
            { id: "gerund-inf", title: "Gerunds vs. Infinitives & -ing Forms", url: "gerunds-ing.html", tags: ["Grammar", "Gerunds & -ing"] }
          ]
        },
        {
          id: "vocabulary",
          name: "Vocabulary",
          accent: "#0284c7",
          bg: "#e0f2fe",
          exercises: [
            { id: "collocations-biz", title: "Make, Do, Take & Have Collocations", url: "collocations.html", tags: ["Vocabulary", "Collocations"] },
            { id: "phrasal-work", title: "Phrasal Verbs for Work & Meetings", url: "phrasal-verbs.html", tags: ["Vocabulary", "Phrasal Verbs"] },
            { id: "idioms-daily", title: "Everyday English Idioms", url: "idioms.html", tags: ["Vocabulary", "Idioms"] }
          ]
        },
        {
          id: "reading",
          name: "Reading",
          accent: "#4f46e5",
          bg: "#eef2ff",
          exercises: [
            { id: "learning-english-tips", title: "Learning English Tips", url: "learning_english_tips.html", tags: ["Reading", "Vocabulary", "Listening"] },
            { id: "airport-notice", title: "Airport Notice Reading", url: "airport_notice_reading.html", tags: ["Reading", "Vocabulary"] },
            { id: "little-prince", title: "The Little Prince - Chapter I", url: "little-prince.html", tags: ["Reading", "Vocabulary"] }
          ]
        },
        {
          id: "listening",
          name: "Listening & Songs",
          accent: "#f43f5e",
          bg: "#ffe4e6",
          exercises: [
            { id: "animals-maroon", title: "Animals - Maroon 5", url: "animals_maroon.html", tags: ["Listening", "Vocabulary"] },
            { id: "somebody-used-to-know", title: "Somebody That I Used to Know", url: "CancionSomebodyusedtoknow.html", tags: ["Listening", "Vocabulary"] },
            { id: "i-gonna-be", title: "I'm Gonna Be (500 Miles)", url: "I_gonna_be.html", tags: ["Listening", "Vocabulary"] },
            { id: "song-lumineers", title: "Ho Hey - The Lumineers", url: "ho-hey.html", tags: ["Listening", "Vocabulary"] }
          ]
        },
        {
          id: "writing",
          name: "Writing",
          accent: "#d97706",
          bg: "#fef3c7",
          exercises: [
            { id: "balanced-essay", title: "Balanced Essay Practice", url: "Balanced_Essay.html", tags: ["Writing"] },
            { id: "writing-email", title: "Writing 1: Professional Follow-up Email", url: "writing-1.html", tags: ["Writing"] },
            { id: "writing-story", title: "Writing 2: A Memorable Trip (Past Tenses)", url: "writing-2.html", tags: ["Writing"] }
          ]
        }
      ];

      const SKILLS = [
        { id: "grammar", label: "Grammar" },
        { id: "gerunds", label: "Gerunds & -ing Forms" },
        { id: "vocabulary", label: "Vocabulary" },
        { id: "collocations", label: "Collocations" },
        { id: "phrasal", label: "Phrasal Verbs" },
        { id: "idioms", label: "Idioms" },
        { id: "listening", label: "Listening" },
        { id: "reading", label: "Reading Comprehension" },
        { id: "writing", label: "Writing" }
      ];

      let activeCategory = "all";

      function loadScores() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          return raw ? JSON.parse(raw) : {};
        } catch (e) {
          return {};
        }
      }

      const scores = loadScores();

      function renderCatalog() {
        const container = document.getElementById("catalog-container");
        if (!container) return;

        const visibleCategories = CATEGORIES.filter(
          (cat) => activeCategory === "all" || cat.id === activeCategory
        );

        container.innerHTML = visibleCategories.map((cat) => {
          const itemsHtml = cat.exercises.map((ex, idx) => {
            const tagsHtml = ex.tags.map((t) => `<span class="skill-pill">${t}</span>`).join("");
            const rec = scores[ex.id];
            let actionText = "Start Practice";
            let actionClass = "exercise-action";

            if (rec) {
              const vals = Object.values(rec).filter((v) => typeof v === "number");
              if (vals.length) {
                const avg = Math.round(vals.reduce((a, b) => a + b, 0) / vals.length);
                actionText = `Completed • ${avg}%`;
                actionClass = "exercise-action done";
              }
            }

            const num = String(idx + 1).padStart(2, "0");

            return `
              <li class="exercise-item">
                <a href="${ex.url}" class="exercise-link">
                  <div class="exercise-left">
                    <span class="exercise-index">${num}</span>
                    <div class="exercise-info">
                      <span class="exercise-title">${ex.title}</span>
                      <div class="exercise-meta">${tagsHtml}</div>
                    </div>
                  </div>
                  <span class="${actionClass}">${actionText}</span>
                </a>
              </li>
            `;
          }).join("");

          return `
            <section class="category-section" style="--cat-accent: ${cat.accent}; --cat-bg: ${cat.bg};">
              <div class="category-section-header">
                <h2>${cat.name}</h2>
                <span class="category-count">${cat.exercises.length} ${cat.exercises.length === 1 ? "activity" : "activities"}</span>
              </div>
              <ul class="exercise-list">
                ${itemsHtml}
              </ul>
            </section>
          `;
        }).join("");
      }

      function renderProgress() {
        const allExercises = CATEGORIES.flatMap((c) => c.exercises);
        let completed = 0;
        const buckets = {};
        SKILLS.forEach((s) => { buckets[s.id] = []; });

        Object.entries(scores).forEach(([exId, data]) => {
          if (!data) return;
          completed++;
          SKILLS.forEach((s) => {
            if (typeof data[s.id] === "number") {
              buckets[s.id].push(data[s.id]);
            }
          });
        });

        const totalStat = document.getElementById("total-ex-stat");
        const compStat = document.getElementById("completed-ex-stat");
        if (totalStat) totalStat.textContent = String(allExercises.length);
        if (compStat) compStat.textContent = String(completed);

        const summaryEl = document.getElementById("progress-summary");
        if (summaryEl) {
          summaryEl.textContent = `Completed: ${completed} / ${allExercises.length}`;
        }

        const gridEl = document.getElementById("skills-grid");
        if (!gridEl) return;

        gridEl.innerHTML = SKILLS.map((s) => {
          const arr = buckets[s.id];
          const avg = arr.length ? Math.round(arr.reduce((a, b) => a + b, 0) / arr.length) : 0;
          const labelRight = arr.length ? `${avg}%` : "No data";
          return `
            <div class="skill-row-card">
              <div class="skill-row-top">
                <span>${s.label}</span>
                <span>${labelRight}</span>
              </div>
              <div class="bar-bg">
                <div class="bar-fill" style="width:${avg}%"></div>
              </div>
            </div>
          `;
        }).join("");
      }

      function init() {
        renderCatalog();
        renderProgress();

        document.querySelectorAll(".category-btn").forEach((btn) => {
          btn.addEventListener("click", () => {
            activeCategory = btn.getAttribute("data-category") || "all";
            document.querySelectorAll(".category-btn").forEach((b) => b.classList.remove("active"));
            btn.classList.add("active");
            renderCatalog();
          });
        });
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", init);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
