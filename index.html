<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Merry Mery English | Interactive Exercises</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy-950: #091526;
      --navy-900: #0f2342;
      --navy-800: #17345e;
      --navy-700: #1e457c;
      --teal-600: #0d9488;
      --teal-500: #14b8a6;
      --teal-100: #ccfbf1;
      --teal-50: #f0fdfa;
      --sky-500: #0ea5e9;
      --coral-500: #f43f5e;
      --amber-500: #f59e0b;
      --violet-600: #7c3aed;
      --slate-900: #0f172a;
      --slate-600: #475569;
      --slate-400: #94a3b8;
      --slate-200: #e2e8f0;
      --bg: #f1f5f9;
      --card: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg);
      background-image:
        radial-gradient(circle at 12% 8%, rgba(20, 184, 166, 0.14) 0%, transparent 42%),
        radial-gradient(circle at 88% 12%, rgba(23, 52, 94, 0.10) 0%, transparent 45%),
        radial-gradient(circle at 50% 95%, rgba(14, 165, 233, 0.08) 0%, transparent 50%);
      color: var(--slate-900);
      line-height: 1.5;
      min-height: 100vh;
    }

    h1, h2, h3, .brand-font {
      font-family: 'Outfit', sans-serif;
    }

    /* ================= TOP HEADER ================= */
    .topbar {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(15, 35, 66, 0.08);
      padding: 14px 24px;
      position: sticky;
      top: 0;
      z-index: 30;
    }

    .topbar-inner {
      max-width: 1120px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
    }

    .brand-logo-circle {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, var(--teal-500), var(--navy-800));
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 16px rgba(15, 35, 66, 0.22);
    }

    .brand-logo {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background: #ffffff;
      display: block;
    }

    .brand-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.55rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--navy-900);
      line-height: 1.15;
    }

    .brand-title span {
      color: var(--teal-600);
    }

    .brand-subtitle {
      font-size: 0.78rem;
      color: var(--slate-600);
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .btn-progress-top {
      background: var(--navy-900);
      color: #ffffff;
      padding: 11px 22px;
      border-radius: 999px;
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 0.92rem;
      text-decoration: none;
      box-shadow: 0 6px 16px rgba(15, 35, 66, 0.2);
      transition: transform 0.16s ease, background 0.16s ease;
    }

    .btn-progress-top:hover {
      background: var(--teal-600);
      transform: translateY(-2px);
    }

    /* ================= MAIN CONTAINER ================= */
    .container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 32px 24px 110px;
    }

    /* ================= HERO BANNER ================= */
    .hero-banner {
      background: linear-gradient(135deg, var(--navy-950) 0%, var(--navy-900) 52%, var(--navy-800) 100%);
      color: #ffffff;
      border-radius: 26px;
      padding: 36px 38px;
      margin-bottom: 32px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 20px 40px -15px rgba(9, 21, 38, 0.45);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      flex-wrap: wrap;
    }

    .hero-banner::before {
      content: "";
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(20, 184, 166, 0.35) 0%, transparent 70%);
      top: -110px;
      right: -40px;
      pointer-events: none;
    }

    .hero-text {
      position: relative;
      z-index: 1;
      max-width: 620px;
    }

    .hero-pill {
      display: inline-block;
      background: rgba(20, 184, 166, 0.22);
      border: 1px solid rgba(20, 184, 166, 0.45);
      color: #5eead4;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 5px 14px;
      border-radius: 999px;
      margin-bottom: 12px;
    }

    .hero-banner h1 {
      font-size: 2.1rem;
      font-weight: 800;
      line-height: 1.18;
      margin-bottom: 8px;
    }

    .hero-banner p {
      font-size: 1rem;
      color: rgba(255, 255, 255, 0.86);
    }

    .hero-counters {
      position: relative;
      z-index: 1;
      display: flex;
      gap: 14px;
    }

    .counter-box {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(8px);
      border-radius: 18px;
      padding: 16px 22px;
      text-align: center;
      min-width: 118px;
    }

    .counter-box strong {
      display: block;
      font-family: 'Outfit', sans-serif;
      font-size: 1.8rem;
      font-weight: 800;
      color: #5eead4;
      line-height: 1.1;
    }

    .counter-box span {
      font-size: 0.76rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      opacity: 0.9;
    }

    /* ================= PYRAMID CATEGORY CARDS (1 + 2 + 3) ================= */
    .category-pyramid {
      display: flex;
      flex-direction: column;
      gap: 18px;
      margin-bottom: 36px;
    }

    .pyramid-row-1 {
      display: grid;
      grid-template-columns: 1fr;
    }

    .pyramid-row-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .pyramid-row-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    @media (max-width: 820px) {
      .pyramid-row-2,
      .pyramid-row-3 {
        grid-template-columns: 1fr;
      }
    }

    .cat-card-btn {
      appearance: none;
      width: 100%;
      background: var(--card);
      border: 2px solid rgba(15, 35, 66, 0.08);
      border-radius: 22px;
      padding: 22px 26px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      cursor: pointer;
      text-align: left;
      box-shadow: 0 10px 24px -8px rgba(15, 35, 66, 0.08);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease, background 0.2s ease;
    }

    .cat-card-btn:hover {
      transform: translateY(-3px);
      border-color: var(--teal-500);
      box-shadow: 0 16px 30px -10px rgba(13, 148, 136, 0.24);
    }

    .cat-card-btn.featured-all {
      background: linear-gradient(135deg, var(--navy-900) 0%, var(--navy-800) 100%);
      border-color: var(--navy-800);
      padding: 24px 30px;
    }

    .cat-card-btn.featured-all .cat-card-title {
      color: #ffffff;
      font-size: 1.45rem;
    }

    .cat-card-btn.featured-all .cat-card-sub {
      color: rgba(255, 255, 255, 0.82);
    }

    .cat-card-btn.featured-all .cat-card-badge {
      background: rgba(255, 255, 255, 0.14);
      color: #5eead4;
      border-color: rgba(94, 234, 212, 0.35);
    }

    .cat-card-btn.active:not(.featured-all) {
      background: linear-gradient(135deg, var(--navy-900) 0%, var(--teal-600) 100%);
      border-color: transparent;
      box-shadow: 0 16px 32px -10px rgba(13, 148, 136, 0.38);
    }

    .cat-card-btn.active:not(.featured-all) .cat-card-title {
      color: #ffffff;
    }

    .cat-card-btn.active:not(.featured-all) .cat-card-sub {
      color: rgba(255, 255, 255, 0.86);
    }

    .cat-card-btn.active:not(.featured-all) .cat-card-badge {
      background: rgba(255, 255, 255, 0.18);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.3);
    }

    .cat-card-left {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .cat-circle {
      width: 54px;
      height: 54px;
      min-width: 54px;
      border-radius: 50%;
      background: var(--circle-bg, var(--navy-900));
      color: #ffffff;
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 1.05rem;
      letter-spacing: 0.02em;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 14px rgba(15, 35, 66, 0.22);
      border: 3px solid rgba(255, 255, 255, 0.9);
      flex-shrink: 0;
    }

    .cat-card-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.28rem;
      font-weight: 800;
      color: var(--navy-900);
      line-height: 1.2;
      margin-bottom: 3px;
    }

    .cat-card-sub {
      font-size: 0.86rem;
      color: var(--slate-600);
      font-weight: 500;
    }

    .cat-card-badge {
      font-family: 'Outfit', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--navy-900);
      background: var(--teal-50);
      border: 1px solid var(--teal-100);
      padding: 6px 14px;
      border-radius: 999px;
      white-space: nowrap;
    }

    /* ================= EXERCISE LIST SECTIONS ================= */
    .category-section {
      background: #ffffff;
      border: 1px solid rgba(15, 35, 66, 0.08);
      border-radius: 22px;
      margin-bottom: 26px;
      overflow: hidden;
      box-shadow: 0 10px 26px -8px rgba(15, 35, 66, 0.07);
    }

    .category-section-header {
      padding: 20px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(90deg, var(--navy-900) 0%, var(--navy-800) 100%);
      color: #ffffff;
    }

    .category-section-header h2 {
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: -0.01em;
    }

    .category-count {
      font-family: 'Outfit', sans-serif;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--navy-900);
      background: #5eead4;
      padding: 4px 13px;
      border-radius: 999px;
    }

    .exercise-list {
      list-style: none;
    }

    .exercise-item {
      border-bottom: 1px solid #f1f5f9;
    }

    .exercise-item:last-child {
      border-bottom: none;
    }

    .exercise-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 28px;
      text-decoration: none;
      color: var(--slate-900);
      transition: all 0.16s ease;
    }

    .exercise-link:hover {
      background: linear-gradient(90deg, var(--teal-50) 0%, #ffffff 100%);
      padding-left: 34px;
    }

    .exercise-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .exercise-dot {
      width: 14px;
      height: 14px;
      min-width: 14px;
      border-radius: 50%;
      background: var(--teal-500);
      box-shadow: 0 0 0 4px var(--teal-50);
      transition: transform 0.16s ease, background 0.16s ease;
    }

    .exercise-link:hover .exercise-dot {
      background: var(--navy-900);
      transform: scale(1.15);
    }

    .exercise-info {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .exercise-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--navy-900);
    }

    .exercise-link:hover .exercise-title {
      color: var(--teal-600);
    }

    .exercise-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .skill-pill {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--slate-600);
      background: #f1f5f9;
      padding: 3px 10px;
      border-radius: 999px;
    }

    .exercise-action {
      font-family: 'Outfit', sans-serif;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--navy-900);
      white-space: nowrap;
      padding: 8px 18px;
      border-radius: 999px;
      background: var(--teal-50);
      border: 1.5px solid var(--teal-100);
      transition: all 0.16s ease;
    }

    .exercise-action.done {
      background: #dcfce7;
      color: #166534;
      border-color: #bbf7d0;
    }

    .exercise-link:hover .exercise-action {
      background: var(--navy-900);
      color: #ffffff;
      border-color: var(--navy-900);
    }

    /* ================= PROGRESS PANEL ================= */
    #progress-panel {
      margin-top: 40px;
      background: #ffffff;
      border: 1px solid rgba(15, 35, 66, 0.08);
      border-radius: 22px;
      padding: 28px;
      box-shadow: 0 10px 26px -8px rgba(15, 35, 66, 0.07);
    }

    .progress-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--slate-200);
    }

    .progress-header h2 {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--navy-900);
    }

    .progress-summary {
      font-family: 'Outfit', sans-serif;
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--navy-900);
      background: var(--teal-50);
      padding: 6px 16px;
      border-radius: 999px;
      border: 1px solid var(--teal-100);
    }

    .skills-list-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    @media (max-width: 820px) {
      .skills-list-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 580px) {
      .skills-list-grid {
        grid-template-columns: 1fr;
      }
      .exercise-link {
        flex-direction: column;
        align-items: flex-start;
      }
    }

    .skill-row-card {
      border: 1px solid var(--slate-200);
      border-radius: 14px;
      padding: 16px;
      background: #f8fafc;
    }

    .skill-row-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
    }

    .skill-row-top span:last-child {
      color: var(--teal-600);
    }

    .bar-bg {
      height: 8px;
      background: var(--slate-200);
      border-radius: 999px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--navy-900), var(--teal-500));
      border-radius: 999px;
      width: 0%;
      transition: width 0.4s ease;
    }

    .floating-progress {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 40;
      background: linear-gradient(135deg, var(--navy-900), var(--teal-600));
      color: #ffffff;
      text-decoration: none;
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 0.94rem;
      padding: 13px 22px;
      border-radius: 999px;
      box-shadow: 0 10px 24px rgba(15, 35, 66, 0.35);
      transition: transform 0.15s ease;
    }

    .floating-progress:hover {
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <header class="topbar" id="top">
    <div class="topbar-inner">
      <a href="index.html" class="brand">
        <span class="brand-logo-circle">
          <img src="logo.png" alt="Merry Mery English" class="brand-logo" />
        </span>
        <div>
          <div class="brand-title">Merry Mery <span>English</span></div>
          <div class="brand-subtitle">Interactive Practice Portal</div>
        </div>
      </a>

      <a href="#progress-panel" class="btn-progress-top">My Progress</a>
    </div>
  </header>

  <main class="container">
    <section class="hero-banner">
      <div class="hero-text">
        <span class="hero-pill">Merry Mery English • Practice Hub</span>
        <h1>Choose Your Practice Area</h1>
        <p>Select a category below to explore the exercises and launch any interactive lesson.</p>
      </div>
      <div class="hero-counters">
        <div class="counter-box">
          <strong id="total-ex-stat">52</strong>
          <span>Exercises</span>
        </div>
        <div class="counter-box">
          <strong id="completed-ex-stat">0</strong>
          <span>Completed</span>
        </div>
      </div>
    </section>

    <!-- PIRÁMIDE DE BOTONES: 1 ARRIBA (ALL EXERCISES) + 2 EN EL MEDIO + 3 ABAJO -->
    <nav class="category-pyramid" aria-label="Exercise Categories" id="category-pyramid">
      <!-- Fila 1: All Exercises -->
      <div class="pyramid-row-1">
        <button type="button" class="cat-card-btn featured-all active" data-category="all">
          <div class="cat-card-left">
            <span class="cat-circle" style="--circle-bg: #0d9488;">ALL</span>
            <div>
              <div class="cat-card-title">All Exercises</div>
              <div class="cat-card-sub">View the complete collection across every skill area</div>
            </div>
          </div>
          <span class="cat-card-badge" id="badge-all">52 Activities</span>
        </button>
      </div>

      <!-- Fila 2: 2 Títulos -->
      <div class="pyramid-row-2">
        <button type="button" class="cat-card-btn" data-category="grammar">
          <div class="cat-card-left">
            <span class="cat-circle" style="--circle-bg: #0f2342;">GR</span>
            <div>
              <div class="cat-card-title">Grammar</div>
              <div class="cat-card-sub">Tenses, pronouns, demonstratives & structures</div>
            </div>
          </div>
          <span class="cat-card-badge" id="badge-grammar">17</span>
        </button>

        <button type="button" class="cat-card-btn" data-category="vocabulary">
          <div class="cat-card-left">
            <span class="cat-circle" style="--circle-bg: #0d9488;">VC</span>
            <div>
              <div class="cat-card-title">Vocabulary</div>
              <div class="cat-card-sub">Collocations, phrasal verbs & everyday idioms</div>
            </div>
          </div>
          <span class="cat-card-badge" id="badge-vocabulary">17</span>
        </button>
      </div>

      <!-- Fila 3: 3 Títulos -->
      <div class="pyramid-row-3">
        <button type="button" class="cat-card-btn" data-category="reading">
          <div class="cat-card-left">
            <span class="cat-circle" style="--circle-bg: #17345e;">RD</span>
            <div>
              <div class="cat-card-title">Reading</div>
              <div class="cat-card-sub">Passages, stories & comprehension</div>
            </div>
          </div>
          <span class="cat-card-badge" id="badge-reading">8</span>
        </button>

        <button type="button" class="cat-card-btn" data-category="listening">
          <div class="cat-card-left">
            <span class="cat-circle" style="--circle-bg: #0284c7;">LS</span>
            <div>
              <div class="cat-card-title">Listening & Songs</div>
              <div class="cat-card-sub">Music, lyrics & dictation practice</div>
            </div>
          </div>
          <span class="cat-card-badge" id="badge-listening">6</span>
        </button>

        <button type="button" class="cat-card-btn" data-category="writing">
          <div class="cat-card-left">
            <span class="cat-circle" style="--circle-bg: #0f766e;">WR</span>
            <div>
              <div class="cat-card-title">Writing</div>
              <div class="cat-card-sub">Essays, emails & guided composition</div>
            </div>
          </div>
          <span class="cat-card-badge" id="badge-writing">4</span>
        </button>
      </div>
    </nav>

    <div id="catalog-container"></div>

    <section id="progress-panel">
      <div class="progress-header">
        <h2>My Progress</h2>
        <div class="progress-summary" id="progress-summary">Completed: 0 / 52</div>
      </div>
      <div class="skills-list-grid" id="skills-grid"></div>
    </section>
  </main>

  <a href="#progress-panel" class="floating-progress">My Progress</a>

  <script>
    (function () {
      const STORAGE_KEY = "mme_portal_scores_v1";

      const CATEGORIES = [
        {
          id: "grammar",
          name: "Grammar",
          exercises: [
            { id: "conditionals", title: "Conditionals 0, 1 & 2 in Context", url: "conditionals.html", tags: ["Grammar"] },
            { id: "demonstratives", title: "Demonstratives (This, That, These, Those)", url: "demonstratives.html", tags: ["Grammar", "Vocabulary"] },

            { id: "lose-control-teddy-swims", title: "Lose Control - Teddy Swims", url: "lose_control_teddy_swims.html", tags: ["Listening", "Vocabulary"] }
          ]
        },
        {
          id: "writing",
          name: "Writing",
          exercises: [
            { id: "balanced-essay", title: "Balanced Essay Practice", url: "Balanced_Essay.html", tags: ["Writing"] },
            { id: "writing-email", title: "Writing 1: Professional Follow-up Email", url: "writing-1.html", tags: ["Writing"] },
            { id: "writing-story", title: "Writing 2: A Memorable Trip (Past Tenses)", url: "writing-2.html", tags: ["Writing"] },
            { id: "writing-studio", title: "Writing Studio", url: "writing_studio.html", tags: ["Writing"] }
          ]
        }
      ];

      // Ajustar contadores reales automáticamente según CATEGORIES
      const totalCount = CATEGORIES.reduce((sum, c) => sum + c.exercises.length, 0);
      document.getElementById("total-ex-stat").textContent = String(totalCount);
      document.getElementById("badge-all").textContent = `${totalCount} Activities`;
      document.getElementById("progress-summary").textContent = `Completed: 0 / ${totalCount}`;
      CATEGORIES.forEach((cat) => {
        const badge = document.getElementById(`badge-${cat.id}`);
        if (badge) badge.textContent = String(cat.exercises.length);
      });

      const SKILLS = [
        { id: "grammar", label: "Grammar" },
        { id: "gerunds", label: "Gerunds & -ing Forms" },
        { id: "vocabulary", label: "Vocabulary" },
        { id: "collocations", label: "Collocations" },
        { id: "phrasal", label: "Phrasal Verbs" },
        { id: "idioms", label: "Idioms" },
        { id: "listening", label: "Listening" },
        { id: "reading", label: "Reading Comprehension" },
        { id: "writing", label: "Writing" }
      ];

      let activeCategory = "all";

      function loadScores() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          return raw ? JSON.parse(raw) : {};
        } catch (e) {
          return {};
        }
      }

      const scores = loadScores();

      function updateBadges() {
        const allCount = CATEGORIES.reduce((sum, c) => sum + c.exercises.length, 0);
        const badgeAll = document.getElementById("badge-all");
        if (badgeAll) badgeAll.textContent = `${allCount} Activities`;

        CATEGORIES.forEach((cat) => {
          const el = document.getElementById(`badge-${cat.id}`);
          if (el) el.textContent = String(cat.exercises.length);
        });
      }

      function renderCatalog() {
        const container = document.getElementById("catalog-container");
        if (!container) return;

        const visibleCategories = CATEGORIES.filter(
          (cat) => activeCategory === "all" || cat.id === activeCategory
        );

        container.innerHTML = visibleCategories.map((cat) => {
          const sortedExercises = [...cat.exercises].sort((a, b) =>
            a.title.localeCompare(b.title, 'en', { sensitivity: 'base' })
          );

          const itemsHtml = sortedExercises.map((ex) => {
            const tagsHtml = ex.tags.map((t) => `<span class="skill-pill">${t}</span>`).join("");
            const rec = scores[ex.id];
            let actionText = "Open Exercise";
            let actionClass = "exercise-action";

            if (rec) {
              const vals = Object.values(rec).filter((v) => typeof v === "number");
              if (vals.length) {
                const avg = Math.round(vals.reduce((a, b) => a + b, 0) / vals.length);
                actionText = `Completed • ${avg}%`;
                actionClass = "exercise-action done";
              }
            }

            return `
              <li class="exercise-item">
                <a href="${ex.url}" class="exercise-link">
                  <div class="exercise-left">
                    <span class="exercise-dot" aria-hidden="true"></span>
                    <div class="exercise-info">
                      <span class="exercise-title">${ex.title}</span>
                      <div class="exercise-meta">${tagsHtml}</div>
                    </div>
                  </div>
                  <span class="${actionClass}">${actionText}</span>
                </a>
              </li>
            `;
          }).join("");

          return `
            <section class="category-section">
              <div class="category-section-header">
                <h2>${cat.name}</h2>
                <span class="category-count">${sortedExercises.length} ${sortedExercises.length === 1 ? "exercise" : "exercises"}</span>
              </div>
              <ul class="exercise-list">
                ${itemsHtml}
              </ul>
            </section>
          `;
        }).join("");
      }

      function renderProgress() {
        const allExercises = CATEGORIES.flatMap((c) => c.exercises);
        let completed = 0;
        const buckets = {};
        SKILLS.forEach((s) => { buckets[s.id] = []; });

        Object.entries(scores).forEach(([exId, data]) => {
          if (!data) return;
          completed++;
          SKILLS.forEach((s) => {
            if (typeof data[s.id] === "number") {
              buckets[s.id].push(data[s.id]);
            }
          });
        });

        const totalStat = document.getElementById("total-ex-stat");
        const compStat = document.getElementById("completed-ex-stat");
        if (totalStat) totalStat.textContent = String(allExercises.length);
        if (compStat) compStat.textContent = String(completed);

        const summaryEl = document.getElementById("progress-summary");
        if (summaryEl) {
          summaryEl.textContent = `Completed: ${completed} / ${allExercises.length}`;
        }

        const gridEl = document.getElementById("skills-grid");
        if (!gridEl) return;

        gridEl.innerHTML = SKILLS.map((s) => {
          const arr = buckets[s.id];
          const avg = arr.length ? Math.round(arr.reduce((a, b) => a + b, 0) / arr.length) : 0;
          const labelRight = arr.length ? `${avg}%` : "No data";
          return `
            <div class="skill-row-card">
              <div class="skill-row-top">
                <span>${s.label}</span>
                <span>${labelRight}</span>
              </div>
              <div class="bar-bg">
                <div class="bar-fill" style="width:${avg}%"></div>
              </div>
            </div>
          `;
        }).join("");
      }

      function init() {
        updateBadges();
        renderCatalog();
        renderProgress();

        document.querySelectorAll(".cat-card-btn").forEach((btn) => {
          btn.addEventListener("click", () => {
            activeCategory = btn.getAttribute("data-category") || "all";
            document.querySelectorAll(".cat-card-btn").forEach((b) => b.classList.remove("active"));
            btn.classList.add("active");
            renderCatalog();

            const catalogEl = document.getElementById("catalog-container");
            if (catalogEl) {
              catalogEl.scrollIntoView({ behavior: "smooth", block: "start" });
            }
          });
        });
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", init);
      } else {
        init();
      }
    })();
  </script>
